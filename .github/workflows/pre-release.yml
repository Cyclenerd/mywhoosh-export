name: Pre-release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    # https://github.com/actions/virtual-environments/
    runs-on: ubuntu-22.04
    steps:

      - name: 🛎️ Checkout
        uses: actions/checkout@v7

      # https://github.com/marketplace/actions/setup-go-environment
      - name: 🔧 Setup go
        uses: actions/setup-go@v7

      - name: 🍳 Build
        run: make

      - name: 🌡️ Test
        run: ./mywhoosh-exporter --help

      # Upload binaries
      # https://github.com/marketplace/actions/upload-a-build-artifact
      - name: 📤 Upload
        uses: actions/upload-artifact@v7
        with:
          name: mywhoosh-exporter-artifact
          path: mywhoosh-exporter-*
          retention-days: 1

  test-linux:
    name: Test Linux
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Download binaries
      # https://github.com/marketplace/actions/download-a-build-artifact
      - name: 📥 Download
        uses: actions/download-artifact@v8
        with:
          name: mywhoosh-exporter-artifact
      - name: 🌡️ Test
        run: chmod +x mywhoosh-exporter-linux-x86_64 && ./mywhoosh-exporter-linux-x86_64 --help

  test-macos:
    name: Test macOS
    needs: build
    runs-on: macos-latest
    steps:
      - name: 📥 Download
        uses: actions/download-artifact@v8
        with:
          name: mywhoosh-exporter-artifact
      - name: 🌡️ Test
        run: chmod +x mywhoosh-exporter-macos-arm64 && ./mywhoosh-exporter-macos-arm64 --help

  test-windows:
    name: Test Windows
    needs: build
    runs-on: windows-latest
    steps:
      - name: 📥 Download
        uses: actions/download-artifact@v8
        with:
          name: mywhoosh-exporter-artifact
      - name: 🌡️ Test
        run: .\mywhoosh-exporter-windows-x86_64.exe --help
